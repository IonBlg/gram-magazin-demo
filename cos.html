<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coșul tău — Gram (magazin demo)</title>
  <meta name="description" content="Coșul de cumpărături Gram: produsele alese, greutatea totală a echipamentului și costul livrării. Magazin demo, fără plăți reale.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23C2410C'/%3E%3Ctext x='16' y='23' font-family='Arial' font-weight='800' font-size='20' fill='%23fff' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">
  <!-- Previzualizarea când linkul e trimis pe LinkedIn, Telegram, Facebook etc. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Gram">
  <meta property="og:locale" content="ro_RO">
  <meta property="og:title" content="Coșul tău — Gram (magazin demo)">
  <meta property="og:description" content="Coșul de cumpărături Gram: produsele alese, greutatea totală a echipamentului și costul livrării. Magazin demo, fără plăți reale.">
  <meta property="og:url" content="https://ionblg.github.io/gram-magazin-demo/cos.html">
  <meta property="og:image" content="https://ionblg.github.io/gram-magazin-demo/images/og-gram.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Două rucsacuri de trekking pe o pajiște, cu munți în spate">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cart">
  <a class="skip-link" href="#main">Sari la conținut</a>

  <header id="site-header"></header>

  <main id="main">
    <div class="container">

      <div class="page-head">
        <div class="page-title-row">
          <h1 id="cart-title" tabindex="-1">Coșul tău</h1>
          <p class="page-count" id="cart-count"></p>
        </div>
      </div>

      <!-- Mesaje pentru cititoarele de ecran („Rucsac Sprint 15: 2 buc.”) -->
      <p class="visually-hidden" id="cart-status" aria-live="polite"></p>

      <!-- Conținutul coșului: îl completează main.js din localStorage -->
      <div class="cart-layout" id="cart-content">

        <div class="cart-main">
          <!-- Bara pentru livrare gratuită -->
          <div class="box cart-shipping" id="cart-shipping"></div>

          <!-- Produsele -->
          <section aria-labelledby="cart-items-title">
            <h2 class="visually-hidden" id="cart-items-title">Produse în coș</h2>
            <ul class="cart-items" id="cart-items"></ul>
          </section>

          <!-- Greutatea echipamentului -->
          <section class="box" id="cart-weight" aria-label="Greutatea echipamentului"></section>

          <!-- Kitul recomandat -->
          <section class="box kit-suggestion" id="cart-kit" aria-label="Kit recomandat"></section>
        </div>

        <!-- Sumarul -->
        <aside class="box cart-summary" aria-labelledby="summary-title">
          <h2 id="summary-title">Sumar</h2>
          <div id="cart-summary-rows"></div>
          <a class="btn btn-primary btn-block" href="checkout.html">Continuă spre checkout</a>
          <a class="text-link" href="catalog.html">Continuă cumpărăturile</a>
        </aside>
      </div>

      <!-- Coșul gol -->
      <div class="cart-empty" id="cart-empty" hidden>
        <h2 id="cart-empty-title" tabindex="-1">Coșul e gol</h2>
        <p class="text-muted">Nu ai adăugat încă niciun produs.</p>
        <a class="btn btn-primary" href="catalog.html">Vezi catalogul</a>
      </div>

    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
